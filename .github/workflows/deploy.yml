name: CI / Deploy SEPPYL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seppyl-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build API
        run: cargo build -p api --release --locked
      - run: tar czf "$RUNNER_TEMP/seppyl-api.tar.gz" -C target/release api
      - uses: actions/upload-artifact@v4
        with:
          name: seppyl-api
          path: ${{ runner.temp }}/seppyl-api.tar.gz
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Installing dioxus-cli from source takes ~9 minutes; cache the finished executable.
      - name: Cache Dioxus CLI 0.7.10
        id: cache-dx
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-${{ runner.arch }}-dioxus-cli-0.7.10-v1
      - name: Install official prebuilt Dioxus CLI (only on cache miss)
        if: steps.cache-dx.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10"
          archive="dx-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 "$base/$archive" -o "$RUNNER_TEMP/dx.tar.gz"
          curl -fsSL --retry 3 "$base/dx-x86_64-unknown-linux-gnu.sha256" -o "$RUNNER_TEMP/dx.sha256"
          checksum="$(grep -Eo '[0-9a-fA-F]{64}' "$RUNNER_TEMP/dx.sha256" | head -n 1)"
          test -n "$checksum"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/dx.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/dx-unpacked" "$HOME/.cargo/bin"
          tar -xzf "$RUNNER_TEMP/dx.tar.gz" -C "$RUNNER_TEMP/dx-unpacked"
          executable="$(find "$RUNNER_TEMP/dx-unpacked" -type f -name dx -print -quit)"
          test -n "$executable"
          install -m 0755 "$executable" "$HOME/.cargo/bin/dx"
      - name: Verify Dioxus CLI
        run: dx --version
      - name: Build web
        working-directory: client
        run: dx build --platform web --release
      - name: Package web
        run: |
          index="$(find . -path '*/release/web/public/index.html' -print -quit)"
          test -n "$index"
          tar czf "$RUNNER_TEMP/seppyl-web.tar.gz" -C "$(dirname "$index")" .
      - uses: actions/upload-artifact@v4
        with:
          name: seppyl-web
          path: ${{ runner.temp }}/seppyl-web.tar.gz
  e2e:
    name: Browser E2E (Chromium + real API)
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cache Dioxus CLI 0.7.10
        id: cache-dx
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-${{ runner.arch }}-dioxus-cli-0.7.10-v1
      - name: Install Dioxus CLI from verified official release
        if: steps.cache-dx.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10"
          curl -fsSL --retry 3 "$base/dx-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/dx.tar.gz"
          curl -fsSL --retry 3 "$base/dx-x86_64-unknown-linux-gnu.sha256" -o "$RUNNER_TEMP/dx.sha256"
          checksum="$(grep -Eo '[0-9a-fA-F]{64}' "$RUNNER_TEMP/dx.sha256" | head -n 1)"
          test -n "$checksum"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/dx.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/dx-unpacked" "$HOME/.cargo/bin"
          tar -xzf "$RUNNER_TEMP/dx.tar.gz" -C "$RUNNER_TEMP/dx-unpacked"
          executable="$(find "$RUNNER_TEMP/dx-unpacked" -type f -name dx -print -quit)"
          test -n "$executable"
          install -m 0755 "$executable" "$HOME/.cargo/bin/dx"
      - uses: actions/download-artifact@v4
        with:
          name: seppyl-api
          path: ${{ runner.temp }}/e2e-api
      - name: Extract release API
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-api-bin"
          tar -xzf "$RUNNER_TEMP/e2e-api/seppyl-api.tar.gz" -C "$RUNNER_TEMP/e2e-api-bin"
          test -x "$RUNNER_TEMP/e2e-api-bin/api"
      - name: Build Dioxus browser app for loopback API
        working-directory: client
        env:
          SEPPYL_API_URL: http://127.0.0.1:4173/api
        run: dx build --platform web --release
      - name: Install pinned Playwright test runner and Chromium
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium
      - name: Seed isolated SQLite fixture and run browser tests
        shell: bash
        run: |
          set -euo pipefail
          CI=true python3 scripts/create-legacy-fixture.py data/sappyl.db
          CI=true python3 scripts/prepare-e2e-fixture.py data/sappyl.db
          index="$(find . -path '*/release/web/public/index.html' -print -quit)"
          test -n "$index"
          export SEPPYL_E2E_API_BINARY="$RUNNER_TEMP/e2e-api-bin/api"
          export SEPPYL_E2E_WEB_ROOT="$PWD/$(dirname "$index")"
          bash scripts/run-e2e.sh
      - name: Upload browser traces and screenshots on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seppyl-browser-e2e-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, build-api, build-web, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seppyl-api
          path: ${{ runner.temp }}/api
      - uses: actions/download-artifact@v4
        with:
          name: seppyl-web
          path: ${{ runner.temp }}/web
      - name: Configure SSH
        env:
          SSH_API_KEY: ${{ secrets.DEPLOY_API_SSH_KEY }}
          SSH_WEB_KEY: ${{ secrets.DEPLOY_WEB_SSH_KEY }}
          SSH_HOST_KEYS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_API_KEY" > ~/.ssh/api_key
          printf '%s\n' "$SSH_WEB_KEY" > ~/.ssh/web_key
          printf '%s\n' "$SSH_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/*_key ~/.ssh/known_hosts
      - name: Deploy API
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          cat "$RUNNER_TEMP/api/seppyl-api.tar.gz" | ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i ~/.ssh/api_key -p "$PORT" "lud@$HOST"
      - name: Deploy Web
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          cat "$RUNNER_TEMP/web/seppyl-web.tar.gz" | ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i ~/.ssh/web_key -p "$PORT" "lud@$HOST"
      - name: Verify public API and SPA after deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --connect-timeout 5 --max-time 15             https://seppyl.donnarieix.fr/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin).get("status") == "ok"'
          for route in / /login /public /mentions-legales; do
            curl -fsS --retry 3 --retry-delay 2 --connect-timeout 5 --max-time 15               "https://seppyl.donnarieix.fr$route" -o "$RUNNER_TEMP/seppyl-smoke.html"
            test -s "$RUNNER_TEMP/seppyl-smoke.html"
          done
