name: Refresh Cargo.lock (temporary)
on:
  push:
    branches:
      - integration/seppyl-ui-production
    paths:
      - .github/workflows/refresh-lock.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve all workspace dependencies
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit updated lockfile to integration branch
        run: |
          set -euo pipefail
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Refresh Cargo.lock for complete SEPPYL workspace"
            git push origin HEAD:integration/seppyl-ui-production
          fi
