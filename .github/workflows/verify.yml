name: Verify SEPPYL

on:
  workflow_call:
  push:
    branches:
      - ui-tableur
      - 'feat/**'
  workflow_dispatch:

concurrency:
  group: seppyl-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test browser theme interaction
        run: |
          node --test client/tests/*.test.cjs
          node --check client/assets/rich-editor.js
          node --check client/assets/tactics-board.js
          node --check client/assets/tactics-fullscreen.js
          node --check client/assets/select-overlay.js
          node --check client/assets/logo-crop.js
          node --check client/assets/toast.js
          node --check client/assets/auth-guard.js
          node --check client/assets/audit-dates.js
      - name: Verify release version, changelog and notes
        run: python3 scripts/release-version.py --check
      - name: Verify committed production lockfile
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Check API
        run: cargo check -p api --locked
      - name: Check Web Client
        run: cargo check -p client --target wasm32-unknown-unknown --no-default-features --features web --locked
      - name: Test API
        run: cargo test -p api --locked

      - name: Create safe synthetic legacy data for migration tests
        run: python3 scripts/create-legacy-fixture.py data/sappyl.db

      - name: Verify startup with existing SQLite data
        env:
          JWT_SECRET: development-ci-only-secret
        shell: bash
        run: |
          cargo build -p api
          cargo run -p api > /tmp/seppyl-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ok=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 1 http://127.0.0.1:3000/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/seppyl-api.log
            exit 1
          fi
          echo "Existing SQLite copy migration and API startup succeeded"
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          old_path = Path("data/seppyl.local.db-before-player-migration")
          new_path = Path("data/seppyl.local.db")
          assert old_path.is_file(), "Pre-migration backup was not created"
          with sqlite3.connect(old_path) as old, sqlite3.connect(new_path) as new:
              old_count = old.execute("SELECT COUNT(*) FROM players").fetchone()[0]
              new_count = new.execute("SELECT COUNT(*) FROM players").fetchone()[0]
              assert new_count == old_count, "Player count changed during migration"
              assert new.execute("PRAGMA foreign_key_check").fetchall() == [], "Broken SQLite references"
              for idx in new.execute("PRAGMA index_list('players')"):
                  if idx[2]:
                      columns = [col[2] for col in new.execute(
                          'PRAGMA index_info("' + idx[1].replace('"', '""') + '")'
                      )]
                      assert columns != ["firstname"], "Legacy unique first-name index remains"
          print("Verified backup, player IDs and foreign keys after migration")
          PY

      - name: Verify production data path, immutable backup and activity preservation
        env:
          JWT_SECRET: production-migration-fixture-secret
        shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          mkdir -p "$temp/data"
          cp data/sappyl.db "$temp/data/sappyl.db"
          python3 - "$temp/data/sappyl.db" "$temp/pre.json" <<'PY'
          import json,sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as db:
              names={row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              counts={name:db.execute('SELECT COUNT(*) FROM "'+name+'"').fetchone()[0]
                      for name in ("activities","activity_player","catalog_activities",
                                   "training_activities","trainings","players") if name in names}
          with open(sys.argv[2],"w") as f: json.dump(counts,f)
          PY
          (
            cd "$temp"
            SEPPYL_BIND=127.0.0.1:3101 "$workspace/target/debug/api"
          ) > "$temp/api.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$temp"' EXIT
          healthy=0
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 1 http://127.0.0.1:3101/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then cat "$temp/api.log"; exit 1; fi
          python3 - "$temp/data/sappyl.db" "$temp/pre.json" <<'PY'
          import json,sqlite3,sys
          from pathlib import Path
          db_path=Path(sys.argv[1])
          backup=Path(str(db_path)+"-before-v0.1")
          assert backup.is_file(),"Pre-v0.1 production snapshot was not created"
          with sqlite3.connect(db_path) as after,sqlite3.connect(backup) as before:
              assert after.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert after.execute("PRAGMA foreign_key_check").fetchall()==[]
              assert before.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              original=json.load(open(sys.argv[2]))
              for table,count in original.items():
                  new_count=after.execute('SELECT COUNT(*) FROM "'+table+'"').fetchone()[0]
                  assert new_count>=count,f"Lost data from {table}: {count} -> {new_count}"
              assert not Path(str(db_path).replace("sappyl.db","seppyl.local.db")).exists(),\
                 "Production must not silently switch to development database"
          print("Production-path migration preserved existing activities and created a consistent backup")
          PY
