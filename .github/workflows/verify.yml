name: Verify SEPPYL

on:
  push:
    branches:
      - ui-tableur
      - 'feat/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test browser theme interaction
        run: |
          node --test client/tests/*.test.cjs
          node --check client/assets/rich-editor.js
          node --check client/assets/tactics-board.js
          node --check client/assets/tactics-fullscreen.js
          node --check client/assets/select-overlay.js
          node --check client/assets/logo-crop.js
          node --check client/assets/toast.js
          node --check client/assets/auth-guard.js
          node --check client/assets/audit-dates.js
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Check API
        run: cargo check -p api
      - name: Check Web Client
        run: cargo check -p client --target wasm32-unknown-unknown --no-default-features --features web
      - name: Test API
        run: cargo test -p api

      - name: Verify startup with existing SQLite data
        env:
          JWT_SECRET: development-ci-only-secret
        shell: bash
        run: |
          cargo build -p api
          cargo run -p api > /tmp/seppyl-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ok=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 1 http://127.0.0.1:3000/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/seppyl-api.log
            exit 1
          fi
          echo "Existing SQLite copy migration and API startup succeeded"
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          old_path = Path("data/seppyl.local.db-before-player-migration")
          new_path = Path("data/seppyl.local.db")
          assert old_path.is_file(), "Pre-migration backup was not created"
          with sqlite3.connect(old_path) as old, sqlite3.connect(new_path) as new:
              old_count = old.execute("SELECT COUNT(*) FROM players").fetchone()[0]
              new_count = new.execute("SELECT COUNT(*) FROM players").fetchone()[0]
              assert new_count == old_count, "Player count changed during migration"
              assert new.execute("PRAGMA foreign_key_check").fetchall() == [], "Broken SQLite references"
              for idx in new.execute("PRAGMA index_list('players')"):
                  if idx[2]:
                      columns = [col[2] for col in new.execute(
                          'PRAGMA index_info("' + idx[1].replace('"', '""') + '")'
                      )]
                      assert columns != ["firstname"], "Legacy unique first-name index remains"
          print("Verified backup, player IDs and foreign keys after migration")
          PY
