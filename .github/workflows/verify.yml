name: Verify SEPPYL

on:
  push:
    branches:
      - ui-tableur
      - 'feat/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test browser theme interaction
        run: node --test client/tests/theme-transition.test.cjs
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Check API
        run: cargo check -p api
      - name: Check Web Client
        run: cargo check -p client --target wasm32-unknown-unknown --no-default-features --features web
      - name: Test API
        run: cargo test -p api

      - name: Verify startup with existing SQLite data
        env:
          JWT_SECRET: development-ci-only-secret
        shell: bash
        run: |
          cargo build -p api
          cargo run -p api > /tmp/seppyl-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ok=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 1 http://127.0.0.1:3000/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/seppyl-api.log
            exit 1
          fi
          echo "Existing SQLite copy migration and API startup succeeded"
