[package]
name = "client"
version = "0.1.1"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
gloo-storage = "0.3.0"
serde_json = "1.0"
chrono = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
