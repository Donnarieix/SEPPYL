<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Page introuvable | SEPPYL</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;
      background:#101f2a;color:#f3f6f9;padding:24px;text-align:center}
    main{max-width:560px}
    strong{display:block;color:#65c4cd;font-size:clamp(70px,16vw,112px);line-height:1;letter-spacing:-.06em}
    h1{font-size:clamp(24px,5vw,36px);margin:16px 0}
    p{color:#c5d3dd;line-height:1.6;margin:0 0 30px}
    nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    a{color:#101f2a;background:#86d2d7;text-decoration:none;padding:11px 20px;border-radius:10px;font-weight:700}
    a.secondary{color:#f3f6f9;background:transparent;border:1px solid #667c8a}
    a:focus-visible{outline:3px solid white;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <strong>404</strong>
    <h1>Page introuvable</h1>
    <p>Cette adresse n'existe pas ou cette page n'est plus disponible.</p>
    <nav><a href="/">Retour à l'accueil</a><a class="secondary" href="/public">Explorer les clubs</a></nav>
  </main>
</body>
</html>
