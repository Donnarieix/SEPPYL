# Place in /etc/nginx/sites-available/seppyl and enable with a symlink.
server {
    listen 80;
    server_name seppyl.donnarieix.fr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name seppyl.donnarieix.fr;
    ssl_certificate /etc/letsencrypt/live/donnarieix.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donnarieix.fr/privkey.pem;
    root /var/www/seppyl/current;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
