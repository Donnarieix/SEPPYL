#     try_files /index.html =404;
# }
# location ~ ^/trainings/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(/print)?$ {
#     try_files /index.html =404;
# }
