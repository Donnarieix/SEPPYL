# administrator after reviewing the live reverse-proxy configuration.
# Do not copy over /api, ACME, assets or reverse-proxy blocks.
#
# Built release directory must contain index.html and 404.html.
# This configuration intentionally does NOT run as part of the CI deploy;
# a wrong Nginx rewrite could disable valid links or expose private routes.
